<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - Азия</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-36">

    <!-- Шапка страницы корзины -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-sm font-bold text-orange-500 hover:text-orange-600 transition">
                ← Назад в каталог
            </a>
            <h1 class="font-bold text-base text-gray-900">Корзина 🛒</h1>
            <button onclick="clearCart()" class="text-xs text-red-500 font-bold hover:underline">Очистить</button>
        </div>
    </header>

    <!-- Список товаров в корзине -->
    <main class="max-w-md mx-auto p-4">
        <h2 class="font-bold text-lg mb-3">Ваш заказ</h2>
        
        <div id="cartItemsContainer" class="flex flex-col gap-3">
            <!-- Сюда динамически добавляются товары из localStorage -->
        </div>

        <div id="emptyCartMessage" class="hidden text-center py-12">
            <p class="text-4xl mb-2">🛒</p>
            <p class="text-gray-500 text-sm font-medium">Ваша корзина пуста</p>
            <a href="index.html" class="inline-block mt-4 bg-orange-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">Перейти к покупкам</a>
        </div>
    </main>

    <!-- Нижняя панель итогов и заказа -->
    <div id="cartFooter" class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur-md border-t flex flex-col gap-3 z-40">
        <div class="max-w-md mx-auto w-full flex flex-col gap-1.5 text-sm">
            <div class="flex justify-between text-gray-500">
                <span>Товары:</span>
                <span id="itemsSubtotal">0 сом</span>
            </div>

        <div class="max-w-md mx-auto w-full flex gap-2">
            <button onclick="clearCart()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-3 px-4 rounded-2xl transition">Очистить</button>
            <button onclick="checkoutWhatsApp()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition text-sm">
                Заказать через WhatsApp 📲
            </button>
        </div>
    </div>

    <!-- Скрипты корзины -->
    <script>
        let cart = {};

        window.onload = function() {
            let savedCart = localStorage.getItem('asia_cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            renderCart();
        };

        function saveCart() {
            localStorage.setItem('asia_cart', JSON.stringify(cart));
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            const emptyMsg = document.getElementById('emptyCartMessage');
            const footer = document.getElementById('cartFooter');
            
            container.innerHTML = '';
            
            let keys = Object.keys(cart);
            if (keys.length === 0) {
                emptyMsg.classList.remove('hidden');
                footer.classList.add('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
                footer.classList.remove('hidden');
            }

            let subtotal = 0;

            keys.forEach(id => {
                let item = cart[id];
                subtotal += item.price * item.qty;

                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between gap-3";
                
                card.innerHTML = `
                    <div class="flex-1">
                        <h3 class="text-xs font-bold text-gray-800">${item.name}</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">${item.volume || ''}</p>
                        <span class="font-extrabold text-sm text-gray-900 mt-1 block">${item.price} сом</span>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-100 rounded-xl px-2 py-1">
                        <button onclick="updateQty('${id}', -1)" class="w-6 h-6 bg-white rounded-lg shadow-sm font-bold text-xs flex items-center justify-center text-gray-700">-</button>
                        <span class="text-xs font-bold px-1">${item.qty}</span>
                        <button onclick="updateQty('${id}', 1)" class="w-6 h-6 bg-orange-500 text-white rounded-lg shadow-sm font-bold text-xs flex items-center justify-center">+</button>
                    </div>
                `;
                container.appendChild(card);
            });

            let delivery = 79;
            document.getElementById('itemsSubtotal').innerText = subtotal + ' сом';
            document.getElementById('grandTotal').innerText = (subtotal + delivery) + ' сом';
        }

        function updateQty(id, delta) {
            if (!cart[id]) return;
            cart[id].qty += delta;

            if (cart[id].qty <= 0) {
                delete cart[id];
            }

            saveCart();
            renderCart();
        }

        function clearCart() {
            if (confirm('Очистить всю корзину?')) {
                cart = {};
                saveCart();
                renderCart();
            }
        }

        function checkoutWhatsApp() {
            let keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('Ваша корзина пуста!');
                return;
            }

            let text = "🛒 *Новый заказ из магазина ЯСИН:*\n\n";
            let subtotal = 0;

            keys.forEach((id, index) => {
                let item = cart[id];
                let sum = item.price * item.qty;
                subtotal += sum;
                text += `${index + 1}. ${item.name} (${item.volume || ''}) — ${item.qty} шт. = *${sum} сом*\n`;
            });

            let delivery = 0;
            let total = subtotal + delivery;

            text += `\n📦 Стоимость товаров: ${subtotal} сом`;
            text += `\n💰 *Итого к оплате: ${total} сом*`;

            let phone = "996555123456"; // Укажите ваш WhatsApp номер (без плюса)
            let encodedText = encodeURIComponent(text);
            window.open(`https://wa.me/996558299939?text=${encodedText}`, '_blank');
        }
    </script>
</body>
</html>
