<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приправы и специи - ЯСИН</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .admin-mode [data-editable] {
            cursor: pointer;
            border: 1px dashed #f97316;
            padding: 2px 4px;
            border-radius: 6px;
            background-color: #fff7ed;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-28" id="bodyRoot">

    <!-- 1. ШАПКА САЙТА И ПОИСК -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex flex-col gap-3">
            
            <div class="flex items-center justify-between">
                <!-- Кнопка назад слева -->
                <a href="index.html" class="font-bold text-sm text-orange-600 bg-orange-50 px-3 py-1 rounded-xl transition hover:bg-orange-100">← Назад</a>
                
                <!-- Название категории справа -->
                <h1 id="adminTrigger" onclick="checkAdminAccess()" class="font-bold text-lg text-gray-900 leading-tight cursor-pointer select-none">Приправы</h1>

                <div id="adminStatusBadge" class="hidden text-xs bg-emerald-500 text-white font-bold px-3 py-1 rounded-full">Админка ВКЛ</div>
            </div>

            <!-- Строка поиска -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input 
                    type="text" 
                    id="searchInput"
                    oninput="filterProducts()"
                    placeholder="Поиск приправ, перца, пудры, ванилина..." 
                    class="w-full bg-gray-100 text-gray-800 text-sm rounded-2xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 transition"
                >
            </div>

        </div>
    </header>

    <!-- 3. СКРЫТАЯ АДМИН-ПАНЕЛЬ -->
    <div id="adminPanel" class="hidden max-w-md mx-auto my-4 p-4 bg-white rounded-2xl shadow-md border border-orange-200">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-base text-orange-600">➕ Добавить новый товар</h2>
            <button onclick="checkAdminAccess()" class="text-xs text-red-500 font-bold">Закрыть</button>
        </div>
        <form id="addProductForm" onsubmit="addProduct(event)" class="flex flex-col gap-3">
            <input type="text" id="prodName" placeholder="Название товара" required class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="number" id="prodPrice" placeholder="Цена в сомах" required class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="number" id="prodOldPrice" placeholder="Старая цена (необязательно)" class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="text" id="prodVolume" placeholder="Фасовка / вес (например, 160г, 20г)" required class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="text" id="prodImage" placeholder="Ссылка на изображение (URL)" class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="text" id="prodDiscount" placeholder="Скидка (например, -10%)" class="bg-gray-50 border p-2 rounded-xl text-sm">
            <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 rounded-xl transition text-sm">Опубликовать товар</button>
        </form>
    </div>

    <!-- 4. КАТАЛОГ ТОВАРОВ -->
    <main class="max-w-md mx-auto p-4">
        <h2 class="font-bold text-lg mb-3">Ассортимент</h2>
        <div id="productsGrid" class="grid grid-cols-2 gap-3">
            <!-- Динамические товары -->
        </div>
    </main>

    <!-- 5. НИЖНЯЯ ПЛАВАЮЩАЯ КОРЗИНА -->
    <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/90 backdrop-blur-md border-t flex flex-col items-center gap-1 z-40">
        <a href="korzina.html" onclick="saveCartToStorage()" class="w-full max-w-md bg-yellow-400 hover:bg-yellow-500 font-bold py-3 px-5 rounded-2xl shadow-lg flex items-center justify-between transition text-gray-900">
            <span id="cartSummaryText" class="text-base font-extrabold">0 сом</span>
            <span class="flex items-center gap-2 text-sm">
                Перейти в корзину 🛒
            </span>
        </a>
    </div>

    <!-- 6. СКРИПТЫ УПРАВЛЕНИЯ -->
    <script>
        // Полный список приправ, специй, крахмала и добавок
        let defaultProducts = [
            { id: 4101, name: "ПРИПРАВА УНИВЕРСАЛЬНАЯ", price: 55, oldPrice: null, volume: "160г", image: "https://basket-16.wbbasket.ru/vol2615/part261556/261556241/images/big/1.webp", discount: null },
            { id: 4102, name: "ПРИПРАВА УНИВЕРСАЛЬНАЯ 12 ОВОЩ", price: 55, oldPrice: null, volume: "160г", image: "https://avatars.mds.yandex.net/i?id=beecef3a7f518e2b1f8010a64b69a7de_l-8567811-images-thumbs&n=13", discount: null },
            { id: 4103, name: "ПЕРЕЦ", price: 100, oldPrice: null, volume: "100г", image: "https://basket-16.wbbasket.ru/vol2615/part261592/261592038/images/big/1.webp", discount: null },
            { id: 4104, name: "САХАРНАЯ ПУДРА", price: 55, oldPrice: null, volume: "200г", image: "https://www.zelenyjostrov.ru/upload/iblock/d5d/lt3uffo7683so8q2lld6b5tw976l6cfl.jpeg", discount: null },
            { id: 4105, name: "ЛАВРОВЫЙ ЛИСТ", price: 25, oldPrice: null, volume: "20г", image: "https://basket-38.wbbasket.ru/vol8665/part866560/866560090/images/big/1.webp", discount: null },
            { id: 4106, name: "САХАРНАЯ ПУДРА", price: 25, oldPrice: null, volume: "50г", image: "https://www.zelenyjostrov.ru/upload/iblock/d5d/lt3uffo7683so8q2lld6b5tw976l6cfl.jpeg", discount: null },
            { id: 4107, name: "ЗИРА", price: 20, oldPrice: null, volume: "15г", image: "https://basket-17.wbbasket.ru/vol2675/part267587/267587062/images/big/1.webp", discount: null },
            { id: 4108, name: "ПЕРЕЦ ГОРОШЕК", price: 40, oldPrice: null, volume: "30г", image: "https://avatars.mds.yandex.net/get-mpic/7658590/2a00000190d002af35c5e46fc9ba2990a95e/orig", discount: null },
            { id: 4109, name: "ЛИМОННАЯ КИСЛОТА", price: 35, oldPrice: null, volume: "50г", image: "https://avatars.mds.yandex.net/i?id=6d86b90544ebed929ea486f17b1a2299_l-5241311-images-thumbs&n=13", discount: null },
            { id: 4110, name: "КРАХМАЛ", price: 55, oldPrice: null, volume: "70г", image: "https://avatars.mds.yandex.net/i?id=4ceb763ba04fc03f38e3538d0064c61d_l-5280171-images-thumbs&n=13", discount: null },
            { id: 4111, name: "КРАХМАЛ КУКУРУЗНЫЙ", price: 45, oldPrice: null, volume: "200г", image: "https://korzina74.ru/phpThumb/phpThumb.php?src=/netcat_files/5653/5641/4699300647938.jpg&w=460&far=1&bg=FFFFFF&q=75&fltr%5B%5D=wmi%7C/korzina/img/wm_new_150.png%7CBR%7C100%7C50%7C5", discount: null },
            { id: 4112, name: "КОКОСОВАЯ СТРУЖКА", price: 40, oldPrice: null, volume: "40г", image: "https://avatars.mds.yandex.net/i?id=00bf66f976ef1de85c0b19703c3f9e4a_l-5221937-images-thumbs&n=13", discount: null },
            { id: 4113, name: "КИТАЙ СОЛЬ", price: 35, oldPrice: null, volume: "400г", image: "https://avatars.mds.yandex.net/i?id=0615407b9d8a1b92dfeb22b87dbb91f9_l-5325303-images-thumbs&n=13", discount: null },
            { id: 4114, name: "ПЕРЕЦ МОЛОТЫЙ", price: 50, oldPrice: null, volume: "50г", image: "https://basket-16.wbbasket.ru/vol2615/part261592/261592038/images/big/1.webp", discount: null },
            { id: 4115, name: "ИМБИРЬ", price: 25, oldPrice: null, volume: "15г", image: "https://ir.ozone.ru/s3/multimedia-1-9/7514779257.jpg", discount: null },
            { id: 4116, name: "ПЕРЕЦ ЖГУЧИЙ", price: 30, oldPrice: null, volume: "50г", image: "https://basket-17.wbbasket.ru/vol2623/part262314/262314006/images/big/1.webp", discount: null },
            { id: 4117, name: "ТМИН", price: 30, oldPrice: null, volume: "20г", image: "https://avatars.mds.yandex.net/i?id=dd9551247f21989255c3b29c195448ca79e55d7c-4820979-images-thumbs&n=13", discount: null },
            { id: 4118, name: "КОРИЦА", price: 30, oldPrice: null, volume: "15г", image: "https://avatars.mds.yandex.net/i?id=c77a4934ee6d824d9eac7aa66f62e98c_l-8223678-images-thumbs&n=13", discount: null },
            { id: 4119, name: "КУНЖУТ БЕЛЫЙ", price: 25, oldPrice: null, volume: "25г", image: "https://cdn1.ozone.ru/s3/multimedia-h/6606992357.jpg", discount: null },
            { id: 4120, name: "ГВОЗДИКА", price: 45, oldPrice: null, volume: "15г", image: "https://avatars.mds.yandex.net/get-mpic/5253050/2a00000195bc9e60c710af31b32d2b7a57d2/orig", discount: null },
            { id: 4121, name: "СУХАРИ ПАНИРОВКА", price: 35, oldPrice: null, volume: "150г", image: "https://basket-41.wbbasket.ru/vol10073/part1007368/1007368801/images/big/1.webp", discount: null },
            
            { id: 4122, name: "ПРИПРАВА УНИВЕРСАЛЬНАЯ", price: 10, oldPrice: null, volume: "20г", image: "https://basket-15.wbbasket.ru/vol2385/part238577/238577406/images/big/1.webp", discount: null },
            { id: 4123, name: "ПРИПРАВА ДЛЯ ЛАГМАНА", price: 10, oldPrice: null, volume: "20г", image: "https://basket-16.wbbasket.ru/vol2506/part250630/250630497/images/big/1.webp", discount: null },
            { id: 4124, name: "ПРИПРАВА ДЛЯ ПЛОВА", price: 10, oldPrice: null, volume: "20г", image: "https://basket-16.wbbasket.ru/vol2531/part253125/253125281/images/big/1.webp", discount: null },
            { id: 4125, name: "ПРИПРАВА ДЛЯ ОКОРОЧКОВ", price: 10, oldPrice: null, volume: "20г", image: "https://avatars.mds.yandex.net/i?id=4fd46fd720f2e1b6e08af86f9f0d9e8f60b4ff14-7011986-images-thumbs&n=13", discount: null },
            { id: 4126, name: "ПРИПРАВА ДЛЯ ШАШЛЫКА", price: 10, oldPrice: null, volume: "20г", image: "https://basket-14.wbbasket.ru/vol2090/part209011/209011659/images/big/1.webp", discount: null },
            { id: 4127, name: "ПРИПРАВА ДЛЯ САМСЫ", price: 10, oldPrice: null, volume: "20г", image: "https://basket-14.wbbasket.ru/vol2090/part209011/209011650/images/big/1.webp", discount: null },
            { id: 4128, name: "ПРИПРАВА ДЛЯ МОРКОВИ", price: 10, oldPrice: null, volume: "20г", image: "https://ir.ozone.ru/s3/multimedia-1-v/9671735263.jpg", discount: null },
            { id: 4129, name: "ПРИПРАВА ДЛЯ МЯСА", price: 10, oldPrice: null, volume: "20г", image: "https://avatars.mds.yandex.net/i?id=92194b194e16c875a7dafa0ec3eb7545898b4366-16288324-images-thumbs&n=13", discount: null },
            { id: 4130, name: "ПРИПРАВА ДЛЯ ФУНЧОЗЫ", price: 10, oldPrice: null, volume: "20г", image: "https://ir.ozone.ru/s3/multimedia-1-3/9671733651.jpg", discount: null },
            { id: 4131, name: "ПРИПРАВА ДЛЯ КУУРДАКА", price: 10, oldPrice: null, volume: "20г", image: "https://avatars.mds.yandex.net/i?id=352741fb87110e2a6b8c989b2c4be19c98e62882-5318189-images-thumbs&n=13", discount: null },
            
            { id: 4132, name: "РАЗРЫХЛИТЕЛЬ ТЕСТА", price: 10, oldPrice: null, volume: "10г", image: "https://paykar.shop/upload/iblock/029/hxj6ptfngpxj3l8gb2iah6rgtshlzbc7.jpg", discount: null },
            { id: 4133, name: "ВАНИЛИН", price: 10, oldPrice: null, volume: "5г", image: "https://avatars.mds.yandex.net/i?id=41909125abdd149cb2aff364bd8f130cd3283e5f-9138191-images-thumbs&n=13", discount: null },
            { id: 4134, name: "ЧИМ ЧИМ ДЛЯ ФУНЧОЗЫ", price: 70, oldPrice: null, volume: "60г", image: "https://www.auchan.ru/f/c/insecure/w:620/plain/https://www.auchan.ru/files/original/25051634/", discount: null },
            { id: 4135, name: "ЧИМ ЧИМ ДЛЯ МОРКОВИ", price: 70, oldPrice: null, volume: "60г", image: "https://avatars.mds.yandex.net/i?id=f6e1b60cc9ef8c8b615e5b407f4a25a1_l-9100256-images-thumbs&ref=rim&n=13&w=1000&h=1000", discount: null },
            { id: 4136, name: "ЧИМ ЧИМ ДЛЯ ОГУРЦОВ", price: 70, oldPrice: null, volume: "60г", image: "https://avatars.mds.yandex.net/i?id=e6d99578d3e8a7b0a95af22f060b3cc6_l-4435477-images-thumbs&ref=rim&n=13&w=1000&h=1000", discount: null }
        ];

        let products = JSON.parse(localStorage.getItem('shop_products_spices')) || defaultProducts;
        let clickCount = 0;
        let isAdminActive = false;
        let cart = JSON.parse(localStorage.getItem('asia_cart')) || {};

        window.onload = function() {
            renderProducts();
            updateCartUI();
        };

        function saveCartToStorage() {
            localStorage.setItem('asia_cart', JSON.stringify(cart));
        }

        // Вход в админку по 5 кликам на заголовок
        function checkAdminAccess() {
            clickCount++;
            if (clickCount >= 5) {
                clickCount = 0;
                const password = prompt("Введите пароль администратора:");
                if (password === "484831") {
                    isAdminActive = !isAdminActive;
                    const panel = document.getElementById('adminPanel');
                    const badge = document.getElementById('adminStatusBadge');
                    const body = document.getElementById('bodyRoot');

                    if (isAdminActive) {
                        panel.classList.remove('hidden');
                        badge.classList.remove('hidden');
                        body.classList.add('admin-mode');
                        alert("🔓 Админка включена! Теперь можно удалять товары крестиком и изменять их данные.");
                    } else {
                        panel.classList.add('hidden');
                        badge.classList.add('hidden');
                        body.classList.remove('admin-mode');
                    }
                    renderProducts();
                } else if (password !== null) {
                    alert("❌ Неверный пароль!");
                }
            }
        }

        function renderProducts(itemsToRender = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            itemsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl shadow-sm flex flex-col justify-between relative product-card";
                card.setAttribute('data-name', product.name.toLowerCase());
                
                let currentQty = cart[product.id] ? cart[product.id].qty : 0;

                card.innerHTML = `
                    ${product.discount ? `<span class="absolute top-2 left-2 bg-emerald-500 text-white text-xs font-bold px-2 py-0.5 rounded-full z-10">${product.discount}</span>` : ''}
                    
                    <!-- Кнопка удаления для админа -->
                    <button onclick="deleteProduct(${product.id})" class="admin-only ${isAdminActive ? '' : 'hidden'} absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full text-xs flex items-center justify-center z-20 shadow font-bold">✕</button>

                    <div class="relative w-full h-32 mb-2 flex items-center justify-center bg-gray-50 rounded-xl overflow-hidden">
                        <img src="${product.image || 'https://via.placeholder.com/300?text=Нет+фото'}" alt="${product.name}" class="max-h-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Нет+фото';" ${isAdminActive ? `onclick="editProduct(${product.id}, 'image')" title="Кликните для смены картинки"` : ''}>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1">
                            <span class="font-bold text-base text-gray-900" ${isAdminActive ? `data-editable onclick="editProduct(${product.id}, 'price')"` : ''}>${product.price} сом</span>
                            ${product.oldPrice ? `<span class="text-xs text-gray-400 line-through">${product.oldPrice} сом</span>` : ''}
                        </div>
                        <h3 class="text-xs text-gray-700 line-clamp-2 mt-1" ${isAdminActive ? `data-editable onclick="editProduct(${product.id}, 'name')"` : ''}>${product.name}</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">${product.volume}</p>
                    </div>
                    
                    <div class="flex items-center justify-end mt-3">
                        <div id="control-${product.id}">
                            ${currentQty === 0 ? `
                                <button onclick="changeQuantity(${product.id}, 1)" class="bg-gray-100 hover:bg-orange-500 hover:text-white p-2 rounded-xl transition text-gray-800 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                    </svg>
                                </button>
                            ` : `
                                <div class="flex items-center gap-1 bg-orange-500 text-white rounded-xl px-2 py-1 shadow-sm">
                                    <button onclick="changeQuantity(${product.id}, -1)" class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-sm hover:bg-orange-600 transition">-</button>
                                    <span class="text-xs font-bold px-1">${currentQty}</span>
                                    <button onclick="changeQuantity(${product.id}, 1)" class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-sm hover:bg-orange-600 transition">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Управление количеством в корзине
        function changeQuantity(id, delta) {
            let product = products.find(p => p.id === id);
            if (!product) return;

            if (!cart[id]) {
                cart[id] = { name: `${product.name} (${product.volume})`, price: product.price, volume: product.volume, qty: 0 };
            }

            cart[id].qty += delta;
            if (cart[id].qty <= 0) {
                delete cart[id];
            }

            renderProducts();
            updateCartUI();
            saveCartToStorage();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            for (let id in cart) {
                totalCount += cart[id].qty;
                totalPrice += cart[id].qty * cart[id].price;
            }

            let summaryElement = document.getElementById('cartSummaryText');
            if (totalCount > 0) {
                summaryElement.innerText = `${totalCount} тов. • ${totalPrice} сом`;
            } else {
                summaryElement.innerText = '0 сом';
            }
        }

        // Добавление товара через админку
        function addProduct(event) {
            event.preventDefault();
            
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('prodName').value,
                price: Number(document.getElementById('prodPrice').value),
                oldPrice: document.getElementById('prodOldPrice').value ? Number(document.getElementById('prodOldPrice').value) : null,
                volume: document.getElementById('prodVolume').value,
                image: document.getElementById('prodImage').value,
                discount: document.getElementById('prodDiscount').value || null
            };

            products.unshift(newProduct);
            localStorage.setItem('shop_products_spices', JSON.stringify(products));
            
            renderProducts();
            document.getElementById('addProductForm').reset();
            alert('✅ Товар успешно добавлен в каталог!');
        }

        // Удаление товара в админке
        function deleteProduct(id) {
            if (confirm('Удалить этот товар из каталога?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('shop_products_spices', JSON.stringify(products));
                if (cart[id]) {
                    delete cart[id];
                    updateCartUI();
                    saveCartToStorage();
                }
                renderProducts();
            }
        }

        // Редактирование товара по клику в админке
        function editProduct(id, field) {
            let product = products.find(p => p.id === id);
            if (!product) return;

            if (field === 'name') {
                let newVal = prompt('Новое название товара:', product.name);
                if (newVal !== null && newVal.trim() !== '') {
                    product.name = newVal;
                    if (cart[id]) cart[id].name = `${newVal} (${product.volume})`;
                }
            } else if (field === 'price') {
                let newVal = prompt('Новая цена в сомах:', product.price);
                if (newVal !== null && !isNaN(newVal) && newVal.trim() !== '') {
                    product.price = Number(newVal);
                    if (cart[id]) cart[id].price = Number(newVal);
                    updateCartUI();
                }
            } else if (field === 'image') {
                let newVal = prompt('Новая ссылка на картинку:', product.image);
                if (newVal !== null && newVal.trim() !== '') {
                    product.image = newVal;
                }
            }

            localStorage.setItem('shop_products_spices', JSON.stringify(products));
            saveCartToStorage();
            renderProducts();
        }

        // Фильтрация (быстрый поиск)
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.volume.toLowerCase().includes(query));
            renderProducts(filtered);
        }
    </script>
</body>
</html>
