<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жвачки, сладости и курут - ЯСИН</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .admin-mode [data-editable] {
            cursor: pointer;
            border: 1px dashed #f97316;
            padding: 2px 4px;
            border-radius: 6px;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-28" id="bodyRoot">

    <!-- 1. ШАПКА СТРАНИЦЫ -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex flex-col gap-3">
            
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-1 text-sm font-bold text-blue-500 hover:text-blue-600 transition">
                    ← Назад
                </a>
                <!-- Клик 5 раз по заголовку открывает админку -->
                <h1 id="adminTrigger" onclick="checkAdminAccess()" class="font-bold text-base text-gray-900 leading-tight cursor-pointer select-none text-center">Жвачки & Сладости 🍬</h1>
                <div id="adminStatusBadge" class="hidden text-[10px] bg-emerald-500 text-white font-bold px-2 py-0.5 rounded-full">Админка ВКЛ</div>
            </div>

            <!-- Строка поиска по разделу -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input 
                    type="text" 
                    id="searchInput"
                    oninput="filterProducts()"
                    placeholder="Поиск жвачек, сладостей, курута..." 
                    class="w-full bg-gray-100 text-gray-800 text-sm rounded-2xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                >
            </div>

        </div>
    </header>

    <!-- 2. СКРЫТАЯ АДМИН-ПАНЕЛЬ -->
    <div id="adminPanel" class="hidden max-w-md mx-auto my-4 p-4 bg-white rounded-2xl shadow-md border border-blue-200 mx-4">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-base text-blue-600">➕ Добавить новый товар</h2>
            <button onclick="checkAdminAccess()" class="text-xs text-red-500 font-bold">Закрыть</button>
        </div>
        <form id="addProductForm" onsubmit="addProduct(event)" class="flex flex-col gap-3">
            <input type="text" id="prodName" placeholder="Название (например, ORBIT...)" required class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="number" id="prodPrice" placeholder="Цена в сомах" required class="bg-gray-50 border p-2 rounded-xl text-sm">
            <input type="text" id="prodImage" placeholder="Ссылка на изображение (URL)" required class="bg-gray-50 border p-2 rounded-xl text-sm">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-xl transition text-sm">Опубликовать товар</button>
        </form>
    </div>

    <!-- 3. КАТАЛОГ ТОВАРОВ -->
    <main class="max-w-md mx-auto p-4">
        <h2 class="font-bold text-lg mb-3">Ассортимент</h2>
        <div id="productsGrid" class="grid grid-cols-2 gap-3">
            <!-- Динамические товары -->
        </div>
    </main>

    <!-- 4. НИЖНЯЯ ПЛАВАЮЩАЯ КОРЗИНА -->
    <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/90 backdrop-blur-md border-t flex flex-col items-center gap-1 z-40">
        <a href="korzina.html" onclick="saveCartToStorage()" class="w-full max-w-md bg-yellow-400 hover:bg-yellow-500 font-bold py-3 px-5 rounded-2xl shadow-lg flex items-center justify-between transition text-gray-900">
            <span id="cartSummaryText" class="text-base font-extrabold">0 сом</span>
            <span class="flex items-center gap-2 text-sm">
                Перейти в корзину 🛒
            </span>
        </a>
    </div>

    <!-- 5. СКРИПТЫ УПРАВЛЕНИЯ -->
    <script>
        let clickCount = 0;
        let isAdminActive = false;
        let cart = JSON.parse(localStorage.getItem('asia_cart')) || {};

        // Базовые товары для данного раздела (жвачки, сладости, курут)
        let sweetsProducts = JSON.parse(localStorage.getItem('yasyn_sweets_products')) || [
            { id: 1, name: "ORBIT АРБУЗ 13.5г", price: 35, image: "https://delivery.metro-crimea.com/upload/iblock/904/a3t2pl40wy83yttyjwgso8yjrvoi3v4g/ru_pim_150902001001_01.png" },
            { id: 2, name: "ORBIT КЛУБНИКА 13.5г", price: 35, image: "https://delivery.metro-crimea.com/upload/iblock/fac/vc45276r7dmos85jb3to7sartufz1k65/ru_pim_398369001001_01.png" },
            { id: 3, name: "ORBIT МЯТА 13.5г", price: 35, image: "https://img.fix-price.com/insecure/rs:fit:800:800/plain/bit/_marketplace/images/origin/d8/d8e6a5d9023103a945f9d542058fbea2.jpg" },
            { id: 4, name: "ORBIT WINTERFRESH 13.5г", price: 35, image: "https://megatitan.ru/upload/iblock/752/o22mbkxdoe73yc47fqv8simodcjn0new.jpg" },
            { id: 5, name: "DIROL АРБУЗ ДЫНЯ 13.5г", price: 30, image: "https://shop.assortyidey.ru/upload/resize_cache/iblock/871/1000_600_2/9kuttg3xagk2rulvyl38e8f1kzdewbse.jpg" },
            { id: 6, name: "DIROL МОРОЗНАЯ МЯТА 13.5г", price: 30, image: "https://cdn.metro-cc.ru/ru/ru_pim_401369001001_01.png" },
            { id: 7, name: "DIROL РАНДОМ 13.5г", price: 30, image: "https://avatars.mds.yandex.net/get-eda/13439948/04fb8eb1ef4cdb3b6054eca5dc05fc3f/orig" },
            { id: 8, name: "DIROL ЛЕДНАЯ МЯТА 13.5г", price: 30, image: "https://avatars.mds.yandex.net/get-mpic/1364191/img_id8750385079266131952.jpeg/orig" },
            { id: 9, name: "ALIF АРБУЗ 13.5г", price: 30, image: "https://img2.freepng.ru/20181205/eca/kisspng-product-design-plastic-chewing-gum-png-background-clipart-5c07ae4ef05bc6.8103811715440072469845.jpg" },
            { id: 10, name: "ALIF МЯТА 13.5г", price: 30, image: "https://img2.freepng.ru/20181205/eca/kisspng-product-design-plastic-chewing-gum-png-background-clipart-5c07ae4ef05bc6.8103811715440072469845.jpg" },
            { id: 11, name: "ALIF МАРАКУЯ 13.5г", price: 30, image: "https://img2.freepng.ru/20181205/eca/kisspng-product-design-plastic-chewing-gum-png-background-clipart-5c07ae4ef05bc6.8103811715440072469845.jpg" },
            { id: 12, name: "ALIF КЛУБНИКА БАНАН 13.5г", price: 30, image: "https://img2.freepng.ru/20181205/eca/kisspng-product-design-plastic-chewing-gum-png-background-clipart-5c07ae4ef05bc6.8103811715440072469845.jpg" },
            { id: 13, name: "ELEMENT КЛУБНИКА 13.5г", price: 20, image: "https://bozorcom.ams3.cdn.digitaloceanspaces.com/media/products/element_vUr6Gw0.jpg" },
            { id: 14, name: "ELEMENT МЯТА 13.5г", price: 20, image: "https://bozorcom.ams3.cdn.digitaloceanspaces.com/media/products/element_vUr6Gw0.jpg" },
            { id: 15, name: "ELEMENT ПЕРЕЧНАЯ МЯТА 13.5г", price: 20, image: "https://bozorcom.ams3.cdn.digitaloceanspaces.com/media/products/element_vUr6Gw0.jpg" },
            { id: 16, name: "ELEMENT 1.5г", price: 5, image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRozLT_HhoF9nOtrJoi3RvyEaRlb1FGTwuxmeWb_-NZArqhdW38SA&s&ec=121924526" },
            { id: 17, name: "DIROL АРБУЗ 1.5г", price: 5, image: "https://basket-34.wbbasket.ru/vol7070/part707013/707013267/images/big/1.webp" },
            { id: 18, name: "DIROL МЯТА 1.5г", price: 5, image: "https://avatars.mds.yandex.net/i?id=8167fb473d515cb9a66646b75939e3dd_l-5165563-images-thumbs&ref=rim&n=13&w=701&h=701" },
            { id: 19, name: "KIKIRIKI 1.5г", price: 5, image: "https://images.uzum.uz/cpcmu37frr82f0a4pkd0/t_product_540_high.jpg" },
            { id: 20, name: "ZIZI 20г", price: 10, image: "https://nesipetsin.com:7070/images/product/2020/09/25/19/ffe14532-a219-4010-8bbe-605636ca140b.jpg" },
            { id: 21, name: "CHUPACHUP KDV", price: 5, image: "https://catalog-cdn.detmir.st/media/ChPl8N3wkcGKBfEsAReWCBUtOc9mlMueRi80rmIhiUg=.jpeg" },
            { id: 22, name: "CHUPACHUP LOLIOPOP", price: 10, image: "https://casamega.md/images/thumbnails/1100/1100/detailed/102/24417546__1_.jpg" },
            { id: 23, name: "КУРУТ БИО", price: 5, image: "https://www.shoro.kg/wp-content/uploads/2016/08/krutt-1-min-316x450.png" },
            { id: 24, name: "КУРУТ (5 сом)", price: 5, image: "https://static.tildacdn.com/tild3739-3964-4838-b130-396632643836/photo.jpg" },
            { id: 25, name: "КУРУТ (10 сом)", price: 10, image: "https://static.tildacdn.com/tild3739-3964-4838-b130-396632643836/photo.jpg" },
            { id: 26, name: "TOFFEE КОНФЕТ", price: 5, image: "https://market-banana.ru/upload/iblock/5b7/f0eg9hnlvs9pukybjmfb8au9q1l8mty6.jpg" },
            { id: 27, name: "ГЛАЗ МАРМИЛАД", price: 10, image: "https://main-cdn.sbermegamarket.ru/big1/hlr-system/212/799/642/451/217/37/100050841434b0.jpg" }
        ];

        window.onload = function() {
            renderProducts();
            updateCartUI();
        };

        function saveCartToStorage() {
            localStorage.setItem('asia_cart', JSON.stringify(cart));
        }

        // Вход в админку по 5 кликам по заголовку
        function checkAdminAccess() {
            clickCount++;
            if (clickCount >= 5) {
                clickCount = 0;
                const password = prompt("Введите пароль администратора ");
                if (password === "484831") {
                    isAdminActive = !isAdminActive;
                    const panel = document.getElementById('adminPanel');
                    const badge = document.getElementById('adminStatusBadge');
                    const body = document.getElementById('bodyRoot');

                    if (isAdminActive) {
                        panel.classList.remove('hidden');
                        badge.classList.remove('hidden');
                        body.classList.add('admin-mode');
                        alert("🔓 Админка включена! Теперь можно удалять товары и изменять цены/названия по клику.");
                    } else {
                        panel.classList.add('hidden');
                        badge.classList.add('hidden');
                        body.classList.remove('admin-mode');
                    }
                    renderProducts();
                } else if (password !== null) {
                    alert("❌ Неверный пароль!");
                }
            }
        }

        function renderProducts(itemsToRender = sweetsProducts) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            itemsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl shadow-sm flex flex-col justify-between relative product-card";
                
                let currentQty = cart[product.name] ? cart[product.name].qty : 0;

                card.innerHTML = `
                    <!-- Кнопка удаления для админа -->
                    <button onclick="deleteProduct(${product.id})" class="admin-only ${isAdminActive ? '' : 'hidden'} absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full text-xs flex items-center justify-center z-20 shadow font-bold">✕</button>

                    <div class="relative w-full h-32 mb-2 flex items-center justify-center">
                        <img src="${product.image}" alt="${product.name}" class="max-h-full object-contain rounded-xl" ${isAdminActive ? `onclick="editProduct(${product.id}, 'image')" title="Кликните для смены картинки"` : ''}>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1">
                            <span class="font-bold text-base text-gray-900" ${isAdminActive ? `data-editable onclick="editProduct(${product.id}, 'price')"` : ''}>${product.price} сом</span>
                        </div>
                        <h3 class="text-xs text-gray-700 line-clamp-2 mt-1" ${isAdminActive ? `data-editable onclick="editProduct(${product.id}, 'name')"` : ''}>${product.name}</h3>
                    </div>
                    
                    <div class="flex items-center justify-end mt-3">
                        <div id="control-${product.id}">
                            ${currentQty === 0 ? `
                                <button onclick="changeQuantity(${product.id}, 1)" class="bg-gray-100 hover:bg-blue-500 hover:text-white p-2 rounded-xl transition text-gray-800 flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                    </svg>
                                </button>
                            ` : `
                                <div class="flex items-center gap-1 bg-blue-500 text-white rounded-xl px-2 py-1 shadow-sm">
                                    <button onclick="changeQuantity(${product.id}, -1)" class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-sm hover:bg-blue-600 transition">-</button>
                                    <span class="text-xs font-bold px-1">${currentQty}</span>
                                    <button onclick="changeQuantity(${product.id}, 1)" class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-sm hover:bg-blue-600 transition">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function changeQuantity(id, delta) {
            let product = sweetsProducts.find(p => p.id === id);
            if (!product) return;

            if (!cart[product.name]) {
                cart[product.name] = { name: product.name, price: product.price, volume: "1шт", image: product.image, qty: 0 };
            }

            cart[product.name].qty += delta;
            if (cart[product.name].qty <= 0) {
                delete cart[product.name];
            }

            renderProducts();
            updateCartUI();
            saveCartToStorage();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            for (let key in cart) {
                totalCount += cart[key].qty;
                totalPrice += cart[key].qty * cart[key].price;
            }

            let summaryElement = document.getElementById('cartSummaryText');
            if (totalCount > 0) {
                summaryElement.innerText = `${totalCount} тов. • ${totalPrice} сом`;
            } else {
                summaryElement.innerText = '0 сом';
            }
        }

        function addProduct(event) {
            event.preventDefault();
            
            const newProduct = {
                id: Date.now(),
                name: document.getElementById('prodName').value,
                price: Number(document.getElementById('prodPrice').value),
                image: document.getElementById('prodImage').value
            };

            sweetsProducts.unshift(newProduct);
            localStorage.setItem('yasyn_sweets_products', JSON.stringify(sweetsProducts));
            
            renderProducts();
            document.getElementById('addProductForm').reset();
            alert('✅ Товар успешно добавлен в каталог!');
        }

        function deleteProduct(id) {
            if (confirm('Удалить этот товар из каталога?')) {
                let product = sweetsProducts.find(p => p.id === id);
                sweetsProducts = sweetsProducts.filter(p => p.id !== id);
                localStorage.setItem('yasyn_sweets_products', JSON.stringify(sweetsProducts));
                if (product && cart[product.name]) {
                    delete cart[product.name];
                    updateCartUI();
                    saveCartToStorage();
                }
                renderProducts();
            }
        }

        function editProduct(id, field) {
            let product = sweetsProducts.find(p => p.id === id);
            if (!product) return;

            let oldNameKey = product.name;

            if (field === 'name') {
                let newVal = prompt('Новое название товара:', product.name);
                if (newVal !== null && newVal.trim() !== '') {
                    product.name = newVal;
                    if (cart[oldNameKey]) {
                        cart[newVal] = cart[oldNameKey];
                        cart[newVal].name = newVal;
                        delete cart[oldNameKey];
                    }
                }
            } else if (field === 'price') {
                let newVal = prompt('Новая цена в сомах:', product.price);
                if (newVal !== null && !isNaN(newVal) && newVal.trim() !== '') {
                    product.price = Number(newVal);
                    if (cart[product.name]) cart[product.name].price = Number(newVal);
                    updateCartUI();
                }
            } else if (field === 'image') {
                let newVal = prompt('Новая ссылка на картинку:', product.image);
                if (newVal !== null && newVal.trim() !== '') {
                    product.image = newVal;
                    if (cart[product.name]) cart[product.name].image = newVal;
                }
            }

            localStorage.setItem('yasyn_sweets_products', JSON.stringify(sweetsProducts));
            saveCartToStorage();
            renderProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = sweetsProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }
    </script>
</body>
</html>
